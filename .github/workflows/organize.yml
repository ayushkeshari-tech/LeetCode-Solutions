name: Update Topic Index

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run organizer
        run: python organize_solutions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/topic-cache.json
          git diff --staged --quiet || git commit -m "Update topic index"
          git push
